<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional IVD & Medical Solutions | Dagii Medical</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary-green: #1a936f;
            --dark-green: #114b3a;
            --accent-yellow: #ffc107;
            --light-bg: #f4f9f7;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--light-bg); color: #2d3436; overflow-x: hidden; }

        /* Professional Card Styling */
        .product-card {
            border: none;
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            background: #ffffff;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(26, 147, 111, 0.2);
        }

        .img-wrapper {
            height: 220px;
            overflow: hidden;
            border-radius: 24px 24px 0 0;
            position: relative;
        }

        .compare-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            transform: scale(1.3);
            accent-color: var(--primary-green);
        }

        /* Floating Comparison Bar */
        #compare-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark-green);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            display: none;
            z-index: 1050;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            align-items: center;
            gap: 20px;
        }

        .btn-compare-trigger {
            background: var(--accent-yellow);
            border: none;
            color: #000;
            font-weight: 800;
            padding: 5px 20px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-800 text-uppercase" href="#" style="color: var(--primary-green); letter-spacing: -1px;">
            Dagii<span class="text-warning">Medical</span> <small class="fs-6 opacity-50 fw-light">Distributor Portal</small>
        </a>
        <div class="ms-auto">
            <span id="sync-status" class="badge bg-light text-success border"><i class="fas fa-circle me-1 small"></i> Inventory Live</span>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row align-items-center mb-5">
        <div class="col-lg-6">
            <h1 class="fw-800 display-4 mb-2" style="color: var(--dark-green);">Equipment <span class="text-success">Catalog</span></h1>
            <p class="lead text-muted">Authorized precision diagnostics and clinical furniture for Meru's healthcare sector.</p>
        </div>
        <div class="col-lg-6 text-lg-end">
            <div class="filter-container p-2 bg-white rounded-pill shadow-sm d-inline-flex flex-wrap">
                <button class="btn-filter active" onclick="filterData('all', this)">All Stock</button>
                <button class="btn-filter" onclick="filterData('Diagnostic', this)">Diagnostics</button>
                <button class="btn-filter" onclick="filterData('Digital', this)">Digital/SHA</button>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-8 mx-auto">
            <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white border-end-0 rounded-start-pill"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0 rounded-end-pill py-3" placeholder="Search by model, brand, or clinical application..." onkeyup="searchProducts()">
            </div>
        </div>
    </div>

    <div class="row g-4" id="store-front">
        </div>
</main>

<div id="compare-bar" class="animate__animated animate__slideInUp">
    <span id="compare-count">0 items selected</span>
    <button class="btn-compare-trigger" onclick="openComparison()">Compare Now</button>
</div>

<div class="modal fade" id="compareModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0" style="border-radius: 28px;">
            <div class="modal-body p-5" id="compareBody">
                </div>
        </div>
    </div>
</div>

<script>
    const products = [
        { id: 1, category: "Diagnostic", name: "Seamaty SMT-120V", price: 0, brand: "Seamaty", img: "https://images.unsplash.com/photo-1579152276503-68fe28ec89a1?q=80&w=800", specs: { "Throughput": "35 parameters / 12m", "Sample": "100ul Blood", "Compliance": "ISO 13485" }},
        { id: 2, category: "Diagnostic", name: "Seamaty SMT-50", price: 0, brand: "Seamaty", img: "https://images.unsplash.com/photo-1579152171543-f40a16defd1b?q=80&w=800", specs: { "Throughput": "60 samples / hr", "Screen": "10.4-inch Touch", "Compliance": "CE Marked" }},
        { id: 5, category: "Digital", name: "ZKTeco Biometric", price: 12500, brand: "ZKTeco", img: "https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?q=80&w=800", specs: { "Sensor": "Optical SILK ID", "Interface": "USB 2.0", "Compatibility": "SHA/SHIF Portal" }}
    ];

    let compareList = [];

    function renderProducts(items) {
        const container = document.getElementById('store-front');
        if (items.length === 0) {
            container.innerHTML = `<div class="col-12 text-center py-5 opacity-50"><i class="fas fa-box-open display-1 mb-3"></i><h4>No inventory matches found</h4></div>`;
            return;
        }

        container.innerHTML = items.map(p => `
            <div class="col-md-6 col-lg-4 animate__animated animate__fadeIn">
                <article class="product-card p-2 shadow-sm">
                    <div class="img-wrapper">
                        <input type="checkbox" class="compare-checkbox" onchange="toggleCompare(${p.id}, this)">
                        <img src="${p.img}" alt="${p.name}" class="img-fluid" loading="lazy">
                        <span class="badge bg-white text-dark position-absolute bottom-0 start-0 m-3 shadow-sm">${p.brand}</span>
                    </div>
                    <div class="p-4">
                        <h3 class="h5 fw-bold mb-1">${p.name}</h3>
                        <p class="text-success fw-bold fs-5 mb-3">${p.price === 0 ? 'Request Quote' : 'KSh ' + p.price.toLocaleString()}</p>
                        <div class="d-grid gap-2">
                            <a href="https://wa.me/254790640609?text=I'm interested in the ${p.name}" class="btn btn-success rounded-pill fw-bold">Order on WhatsApp</a>
                        </div>
                    </div>
                </article>
            </div>
        `).join('');
    }

    function toggleCompare(id, checkbox) {
        if (checkbox.checked) {
            if (compareList.length >= 3) {
                alert("You can compare up to 3 items.");
                checkbox.checked = false;
                return;
            }
            compareList.push(products.find(p => p.id === id));
        } else {
            compareList = compareList.filter(p => p.id !== id);
        }
        
        const bar = document.getElementById('compare-bar');
        bar.style.display = compareList.length > 1 ? 'flex' : 'none';
        document.getElementById('compare-count').innerText = `${compareList.length} items selected`;
    }

    function openComparison() {
        const body = document.getElementById('compareBody');
        const specs = [...new Set(compareList.flatMap(p => Object.keys(p.specs)))];

        body.innerHTML = `
            <h2 class="fw-800 mb-4">Technical Comparison</h2>
            <div class="table-responsive">
                <table class="table table-borderless">
                    <thead>
                        <tr>
                            <th>Specification</th>
                            ${compareList.map(p => `<th class="text-center"><img src="${p.img}" width="80" class="rounded mb-2"><br>${p.name}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${specs.map(s => `
                            <tr class="border-top">
                                <td class="fw-bold text-muted">${s}</td>
                                ${compareList.map(p => `<td class="text-center">${p.specs[s] || '—'}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            <button class="btn btn-dark rounded-pill mt-4" data-bs-dismiss="modal">Close Comparison</button>
        `;
        new bootstrap.Modal(document.getElementById('compareModal')).show();
    }

    // Reuse your existing filter/search logic but call this render
    function searchProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        renderProducts(products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)));
    }

    document.addEventListener('DOMContentLoaded', () => renderProducts(products));
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
